# stock_svr 설정 예시.  복사해서 config.local.ini 로 만들어 사용 (config.local.ini 는 git 제외)
# db/setup_db.py 가 [db] 를 자동으로 채운 config.local.ini 를 생성한다.
# 거래 환경(mock/real)·주문허용 스위치는 DB system_setting 에서 관리하고 UI 에서 바꾼다.

[db]
host = 127.0.0.1
port = 4406
name = stock_dealings
user = stock_svr
password =

[kiwoom]
# 앱키/시크릿키는 파일 경로로 지정 (파일 내용 = 키 문자열 한 줄). 키 값 자체를 설정파일에 쓰지 않는다.
appkey_file_real =
secretkey_file_real =
appkey_file_mock =
secretkey_file_mock =
domain_real = https://api.kiwoom.com
domain_mock = https://mockapi.kiwoom.com
ws_real = wss://api.kiwoom.com:10000/api/dostk/websocket
ws_mock = wss://mockapi.kiwoom.com:10000/api/dostk/websocket
# API 호출 간 최소 간격(초). 공식 5회/초 vs 실측 상충 -> 보수적으로 시작하고 api_call_log 로 실측 후 조정
min_interval_sec_real = 0.25
min_interval_sec_mock = 1.1
http_timeout_sec = 10

[anthropic]
# Claude 거부권 필터(claude_advisor) 용 API 키 **파일 경로** (파일 내용 = sk-ant-... 한 줄).
# 키움 키와 동일하게 값 자체는 설정파일에 쓰지 않으며, 비워 두면 claude_advisor 를 쓸 수 없다.
# 모델/확신도/타임아웃 등 운영 파라미터는 DB(알고리즘 탭)에서 관리한다.
apikey_file =
# SDK 재시도 횟수(0~3). 전체 지연이 timeout_sec 를 넘지 않도록 낮게 유지한다.
max_retries = 1

[logging]
# 상대경로는 server 폴더 기준
dir = logs
level = INFO
# 로그 파일 보관 기간(일) - 1주일
retention_days = 7
